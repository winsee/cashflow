# 本地启动：docker compose up -d --build
# 浏览器开 http://localhost:8000。
# 云端部署不用本文件，直接 docker run 拉取 ghcr 镜像，见 README「Docker 部署」。
services:
  cashflow:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CASHFLOW_HTTPS: "off"          # 本地不再需要自签 HTTPS
    ports:
      - "8000:8000"
    volumes:
      - cashflow-data:/data
    restart: unless-stopped

volumes:
  cashflow-data:
