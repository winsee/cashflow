# 房主笔记本一键启动：docker compose -f deploy/compose.yaml up -d
# 玩家手机访问 http://<房主局域网IP>:8000（拍照用系统相机方案，无需 HTTPS）
services:
  cashflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - cashflow-data:/data
      # 说明书扫描页已内置于镜像（server/manual_pages/ 随仓库交付）；
      # 若想不重建镜像就更新页面，可挂载本机目录覆盖：
      # - ./manual_pages:/srv/manual_pages:ro
    restart: unless-stopped

volumes:
  cashflow-data:
