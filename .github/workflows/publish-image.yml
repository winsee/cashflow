# 打 tag（v*）或手动触发时，构建镜像并推送到 Docker Hub 与 GitHub Packages（ghcr.io）。
# 默认精简（WITH_OCR=0，压缩后 ~60MB）：带 OCR 的镜像在小内存云主机上会被 OOM 杀掉，见 Dockerfile 注释。
# 云端部署的拉取命令见 README「Docker 部署」一节。
# Docker Hub 推送需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Read & Write 的 Access Token）；
# 镜像名也由 DOCKERHUB_USERNAME 推导（docker.io/<用户名>/cashflow），源码里不写死账号。
# 未配置时自动跳过 Docker Hub，只推 ghcr，workflow 不会因此失败。
name: publish-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/cashflow
  # Docker Hub 那半边的镜像名在 Check Docker Hub credentials 那一步现拼：
  # secrets 上下文用不在顶层 env 里（这里只有 github/vars/inputs 可用）。

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # image 无论开关与否都要给一个非空的名字：metadata-action 解析 name= 为空会直接报错，
          # 而不是安静地按 enable=false 跳过。
          echo "image=docker.io/${DOCKERHUB_USERNAME:-unused}/cashflow" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送 ghcr.io"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            name=${{ steps.dockerhub.outputs.image }},enable=${{ steps.dockerhub.outputs.enabled }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            WITH_OCR=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
