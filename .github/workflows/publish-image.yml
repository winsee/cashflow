# 打 tag（v*）或手动触发时，构建含本地 OCR 的完整镜像并推送到 Docker Hub 与 GitHub Packages（ghcr.io）。
# 云端部署：docker pull winsee2017/cashflow:latest（见 README）。
# Docker Hub 推送需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Read & Write 的 Access Token）；
# 未配置时自动跳过 Docker Hub，只推 ghcr，workflow 不会因此失败。
name: publish-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/cashflow
  IMAGE_DOCKERHUB: docker.io/winsee2017/cashflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_TOKEN，本次只推送 ghcr.io"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            name=${{ env.IMAGE_DOCKERHUB }},enable=${{ steps.dockerhub.outputs.enabled }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            WITH_OCR=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
