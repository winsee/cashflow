[project]
name = "cashflow-server"
version = "0.1.0"
description = "现金流游戏辅助工具 — 房间服务器（规则引擎 + FastAPI）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "qrcode>=7.4",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "httpx>=0.27",
]
# 本地 OCR（M3，FR-26/30）：不装也能跑，识别链自动降级为手动选卡。
# paddlepaddle 锁 <3.1：3.1+ 在 Windows CPU 开 mkldnn 触发
# ConvertPirAttribute2RuntimeAttribute NotImplementedError（关 mkldnn 则慢 6 倍）。
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0,<3.1",
    "rapidfuzz>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["app/engine/tests", "tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
